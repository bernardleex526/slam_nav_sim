# =============================================================================
# 阶段 B：导航评测矩阵
# -----------------------------------------------------------------------------
# 变量：全局规划器 × 局部控制器
# 固定：地图（来自阶段 A 的最优地图）、定位（amcl）、起终点采样、机器人
#
# 前提：先跑 stage_a_runner.py，产出 stage_a_selected.yaml
# =============================================================================

runner:
  goals_per_run: 5           # 每个 run 下发 5 个目标
  goal_timeout: 150          # 单目标超时
  startup_timeout: 150       # 等 Gazebo + Nav2 + AMCL 就绪
  amcl_settle: 10.0          # AMCL 收敛等待
  cooldown: 8
  headless: true
  output_dir: "~/.ros/sim_stage_b"
  stage_a_selected: "~/.ros/sim_stage_a/stage_a_selected.yaml"

min_goal_dist: 3.0           # 目标离出生点最小距离

experiments:
  # ---- simple 地图上的规划器/控制器横比 ----
  - name: b1_simple_smac2d_dwb
    robot: wheeled_quadruped
    world: simple
    global_planner: smac_2d
    local_planner: dwb
    repeats: 1

  - name: b2_simple_navfn_dwb
    robot: wheeled_quadruped
    world: simple
    global_planner: navfn
    local_planner: dwb
    repeats: 1

  - name: b3_simple_smachybrid_mppi
    robot: wheeled_quadruped
    world: simple
    global_planner: smac_hybrid
    local_planner: mppi
    repeats: 1

  - name: b4_simple_smac2d_rpp
    robot: wheeled_quadruped
    world: simple
    global_planner: smac_2d
    local_planner: rpp
    repeats: 1

  # ---- medium ----
  - name: b5_medium_smac2d_dwb
    robot: wheeled_quadruped
    world: medium
    global_planner: smac_2d
    local_planner: dwb
    repeats: 1

  - name: b6_medium_smachybrid_mppi
    robot: wheeled_quadruped
    world: medium
    global_planner: smac_hybrid
    local_planner: mppi
    repeats: 1

  # ---- complex ----
  - name: b7_complex_smac2d_dwb
    robot: wheeled_quadruped
    world: complex
    global_planner: smac_2d
    local_planner: dwb
    repeats: 1

  - name: b8_complex_smachybrid_mppi
    robot: wheeled_quadruped
    world: complex
    global_planner: smac_hybrid
    local_planner: mppi
    repeats: 1

summary_metrics:
  - key: success_rate
    higher_is_better: true
    label: 成功率
  - key: time_to_goal_mean
    higher_is_better: false
    label: 平均耗时
  - key: tracking_error_rmse
    higher_is_better: false
    label: 跟踪误差
  - key: collision_count
    higher_is_better: false
    label: 碰撞次数

# =============================================================================
# 三张地图建图 + 导航验证矩阵（精简版）
# -----------------------------------------------------------------------------
# 目的：验证三档难度下的完整闭环（建图 → 导航 → 评测），并给出可对比的指标。
# 每档只跑 1 遍（正式评测应该 3~5 遍取统计量，见 benchmark_matrix.yaml）。
# =============================================================================

runner:
  goals_per_run: 3
  goal_timeout: 75.0          # 单目标超时；正式评测用 180
  startup_timeout: 130.0      # 等 Gazebo + slam_toolbox + Nav2 全部就绪
  cooldown: 10.0
  headless: true
  save_final_map: true
  output_dir: "~/.ros/sim_benchmark_3maps"

experiments:
  # ---- 三档难度横比（固定规划器，只变地图）----
  - name: m1_simple
    robot: wheeled_quadruped
    world: simple
    mapping: slam_toolbox
    global_planner: smac_2d
    local_planner: dwb
    repeats: 1

  - name: m2_medium
    robot: wheeled_quadruped
    world: medium
    mapping: slam_toolbox
    global_planner: smac_2d
    local_planner: dwb
    repeats: 1

  - name: m3_complex
    robot: wheeled_quadruped
    world: complex
    mapping: slam_toolbox
    global_planner: smac_2d
    local_planner: dwb
    repeats: 1

  # ---- 规划器对比（固定 complex 地图，只变规划器）----
  - name: p1_complex_smac_hybrid_mppi
    robot: wheeled_quadruped
    world: complex
    mapping: slam_toolbox
    global_planner: smac_hybrid
    local_planner: mppi
    repeats: 1

summary_metrics:
  - key: success_rate
    higher_is_better: true
    label: 成功率
  - key: coverage_ratio
    higher_is_better: true
    label: 建图覆盖率
  - key: occupied_iou
    higher_is_better: true
    label: 占据 IoU
  - key: grid_accuracy
    higher_is_better: true
    label: 栅格一致率
  - key: time_to_goal_mean
    higher_is_better: false
    label: 平均耗时(s)
  - key: tracking_error_rmse
    higher_is_better: false
    label: 跟踪误差(m)
  - key: collision_count
    higher_is_better: false
    label: 碰撞次数

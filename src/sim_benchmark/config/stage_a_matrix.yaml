# =============================================================================
# 阶段 A：建图评测矩阵
# -----------------------------------------------------------------------------
# 变量：建图算法（+ 环境难度）
# 固定：机器人、探索轨迹、传感器档位、导航关闭
#
# 产出：每个环境一张"最优地图"，冻结后交给阶段 B。
# =============================================================================

runner:
  # ---- 探索几何 ----
  lane_spacing: 1.2          # 扫描线间距；3D 雷达有效半径 ~8m，1.2m 重叠充分
  explore_speed: 0.5         # 慢速建图：减少点云运动畸变，但 0.35 太慢会让
                             # medium 地图跑到 26 分钟，0.5 是精度/时长的平衡点
  clearance: 0.45            # 路径离障碍最小距离
  # 单次探索上限。实测路径长度：simple≈190m medium≈557m complex≈302m，
  # 按 0.5m/s + 转弯/修正开销（实际约 0.3m/s 等效）：
  #   simple ≈ 11min，medium ≈ 31min，complex ≈ 17min → 统一给 2400s 留足余量
  max_explore_duration: 2400
  # 仿真起来后等 slam/点云稳定。
  # 从 8 提到 15：启动后 4~11s 内 slam_toolbox 会报
  #   "Message Filter dropping message: frame '...' ... queue is full"
  # （TF buffer 尚未填满的瞬态）。若在此时就开始运动，早期若干帧会以
  # 未就绪的位姿插进地图，表现为出生点附近的放射状飞线。
  warmup: 15.0

  # ---- 编排 ----
  startup_timeout: 130
  cooldown: 8
  headless: true
  output_dir: "~/.ros/sim_stage_a"

experiments:
  # ---- simple：算法正确性底线 ----
  - name: a_simple_slam_toolbox
    robot: wheeled_quadruped
    world: simple
    mapping: slam_toolbox

  # ---- 对照实验：关掉虚拟稳定云台 ----
  #
  # 动机：估计地图出现大量"放射状飞线与大弧线"，且左下 1/4 干净、其余 3/4 崩坏。
  # 这是 map->odom 位姿发散的典型特征，不是"墙没建出来"。
  #
  # 云台节点（gimbal_stabilizer.py）会动态发布 lidar_stabilized 这个 TF frame，
  # 而 slam_toolbox 的 MessageFilter 已经报过
  #   "frame 'lidar_stabilized' ... discarding message because the queue is full"
  # —— 说明存在「雷达消息时间戳」与「云台 TF 时间戳」不同步的风险，
  # 部分扫描可能按错误位姿插进地图。
  #
  # 而本项目在 planar_move 驱动下机器人完全不晃，云台补偿本来就是多余的：
  # 它只增加一个不确定的 TF 源。关掉后雷达直接用静态 lidar_link frame。
  - name: a_simple_slam_toolbox_nogimbal
    robot: wheeled_quadruped
    world: simple
    mapping: slam_toolbox
    use_gimbal: false

  # ---- medium：中等复杂度 ----
  # ⚠️ use_gimbal: false —— simple 环境的对照实验已给出明确结论：
  #    同一条轨迹，开云台那轮 slam_toolbox 中途停摆 9 分钟（Ceres 无输出）、
  #    存图失败整轮作废；关云台那轮完整跑完并正常出图。
  #    planar_move 下机器人不晃，云台补偿本来就没有输入，只多一个
  #    TF 时戳竞争源。结论推广到所有环境（2026-09-11）。
  - name: a_medium_slam_toolbox
    robot: wheeled_quadruped
    world: medium
    mapping: slam_toolbox
    use_gimbal: false

  # ---- complex：高复杂度 ----
  - name: a_complex_slam_toolbox
    robot: wheeled_quadruped
    world: complex
    mapping: slam_toolbox
    use_gimbal: false

  # ---------------------------------------------------------------------------
  # 以下实验需要先安装对应算法包，未安装时 launch 会打印安装提示并跳过算法本体
  # （适配节点仍会启动，不会崩），可以按需启用。

# 全局规划器：Smac 2D
# 在网格上做 A*，但用查找表加速、代价函数可调。相比 NavFn：
#   - 会主动远离障碍（cost_travel_multiplier 把 costmap 的代价纳入搜索）
#   - 规划速度对大地图更友好
# 仍然不考虑运动学约束。
planner_server:
  ros__parameters:
          # ⚠️ 插件 ID 必须叫 GridBased —— Nav2 的默认行为树把它硬编码在
      # PlannerSelector 的 default_planner 上。改成别的名字（比如 Smac2D）
      # 会导致 planner_server 报
      #   'planner X is not a valid planner. Planner names are: Smac2D'
      # 然后每次规划都失败、目标全部 ABORT。
      # 2D/3D/混合各版规划器都用同一个 ID，只换 plugin 那一行。
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # 越大越"怕"障碍，路径越贴中线。室内窄通道场景别设太大，
      # 否则 planners 会在 1.2m 门洞前认为不可通行
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

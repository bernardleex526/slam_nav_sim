# 全局规划器：Smac Hybrid-A*
# 考虑非完整运动学约束（最小转弯半径、前进/倒车代价、转向代价）。
#
# 对轮足/四足该类平台的关键点：
#   轮足和四足都能原地转向（全向性是"转向"级别的，不是"平移"级别的），
#   所以 use_reverse 一般不需要开，rotation_penalty 可以给小一点，
#   允许规划器在狭窄处直接原地调头。
#   如果是阿克曼底盘，则必须给足 minimum_turning_radius，并打开 use_reverse。
planner_server:
  ros__parameters:
          # ⚠️ 插件 ID 必须叫 GridBased —— Nav2 的默认行为树把它硬编码在
      # PlannerSelector 的 default_planner 上。改成别的名字（比如 Smac2D）
      # 会导致 planner_server 报
      #   'planner X is not a valid planner. Planner names are: Smac2D'
      # 然后每次规划都失败、目标全部 ABORT。
      # 2D/3D/混合各版规划器都用同一个 ID，只换 plugin 那一行。
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # DUBIN = 只前进；REEDS_SHEPP = 允许倒车
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72          # 5 度一档，足够精细又不至于炸搜索空间
      minimum_turning_radius: 0.30         # 轮足原地转向能力对应的等效小半径
      reverse_penalty: 2.0
      change_penalty: 0.5
      non_straight_penalty: 1.2            # 偏高一点，让路径更"直"，减少腿式平台的频繁转向
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      rotation_penalty: 5.0                # 原地转向的代价，调小会让它在窄门洞前更敢转
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      use_reverse: false

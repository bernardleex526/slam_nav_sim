# 全局规划器：NavFn（网格型，Dijkstra/A*）
# 最稳的 baseline。不考虑运动学约束，出来的路径可能包含原地急转 ——
# 对差速底盘无所谓，对阿克曼是致命的。用它做对照，能凸显出
# Smac Hybrid-A* 在运动学约束上的价值。
planner_server:
  ros__parameters:
          # ⚠️ 插件 ID 必须叫 GridBased —— Nav2 的默认行为树把它硬编码在
      # PlannerSelector 的 default_planner 上。改成别的名字（比如 Smac2D）
      # 会导致 planner_server 报
      #   'planner X is not a valid planner. Planner names are: Smac2D'
      # 然后每次规划都失败、目标全部 ABORT。
      # 2D/3D/混合各版规划器都用同一个 ID，只换 plugin 那一行。
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5          # 目标点容差；网格型规划器需要它来"贴到"最近的可通行格
      use_astar: false        # false = Dijkstra。网格小的时候 A* 优势不明显，且可能绕远
      allow_unknown: true

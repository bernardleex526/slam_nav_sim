# 局部规划器：DWB（DWA 的改进版）
# 成熟的采样型局部规划器，Nav2 的默认选择。critics 列表决定它的行为倾向。
controller_server:
  ros__parameters:
        # ⚠️ 插件 ID 必须叫 FollowPath —— Nav2 默认行为树把它硬编码在
    # ControllerSelector 的 default_controller 上。用 FollowPathMPPI 之类的
    # 名字会让 BT 找不到控制器，表现为目标一直被 abort 但没有明显报错。
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.0            # 会被 compose 按机器人 max_vel 覆盖
      max_vel_y: 0.0            # 非全向底盘固定为 0
      max_vel_theta: 2.0
      min_speed_xy: 0.0
      max_speed_xy: 1.0
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.0
      decel_lim_x: -2.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.0
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 40
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      # critics 的先后顺序 = 权重的优先级顺序，这个列表比任何单个参数都重要
      critics:
        - RotateToGoal          # 接近目标时先转到位再前进，避免"蹭"着到点
        - Oscillation           # 抑制来回抖动。腿式平台定位噪声大，必须有
        - BaseObstacle          # 硬约束：撞上就否决
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# 局部规划器：MPPI（Model Predictive Path Integral）
# 基于采样的预测控制，天然支持动态障碍规避，控制量平滑。
# 代价：计算量大，WSL 里靠 CPU 跑要注意 batch_size 和 time_steps 的乘积。
# 在 medium / complex（带动态障碍）两张图上，MPPI 和 DWB 的差异会最明显。
controller_server:
  ros__parameters:
        # ⚠️ 插件 ID 必须叫 FollowPath —— Nav2 默认行为树把它硬编码在
    # ControllerSelector 的 default_controller 上。用 FollowPathMPPI 之类的
    # 名字会让 BT 找不到控制器，表现为目标一直被 abort 但没有明显报错。
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40              # 40 x 0.05s = 2s 预测时域
      model_dt: 0.05
      batch_size: 1200            # WSL 里默认 2000 会明显拖慢 RTF，先降到 1200
      vx_std: 0.2
      vy_std: 0.05
      wz_std: 0.4
      vx_max: 1.0
      vx_min: -0.3
      vy_max: 0.0                 # 非全向底盘
      wz_max: 2.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # AckermannConstraints 对差速/轮足关闭
      critics:
        - ConstraintCritic
        - ObstaclesCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic     # 腿式平台频繁倒车没有意义，保留这个 critic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

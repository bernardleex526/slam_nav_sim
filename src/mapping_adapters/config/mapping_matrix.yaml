# =============================================================================
# 建图算法适配矩阵
# -----------------------------------------------------------------------------
# 这个文件是「统一话题契约」的机器可读版本。
# 每个算法只需要在这里声明：从哪读、往哪写、挂在哪个 frame 下。
# 加新算法 = 在这里加一段 + 加一个 launch 目录。下游（rviz / 指标 / benchmark）
# 全部不用改。
# =============================================================================

# ---------------------------------------------------------------------------
# 契约（所有算法都必须最终收敛到这套话题，由 mapping_contract_adapter 保证）
# ---------------------------------------------------------------------------
contract:
  in:
    points: /points            # 3D 点云，PointCloud2
    scan: /scan                # 虚拟 2D 扫描（points_to_scan 产出）
    imu: /imu
    odom: /odom
    rgb: /camera/image_raw
    depth: /camera/depth/image_raw
  out:
    cloud: /map_cloud          # 3D 地图点云（统一入口，rviz / 指标都只认这个）
    cloud_downsampled: /map_cloud_downsampled
    map: /map                  # 2D 占据栅格
    tf_map_to_odom: [map, odom]
  tf_responsibility:
    map_to_odom: 由建图算法发布
    odom_to_base: 由里程计源发布（gt 或 lio，二者互斥！）

# ---------------------------------------------------------------------------
# 各算法的适配参数
# ---------------------------------------------------------------------------
algorithms:

  # -------------------------------------------------------------------------
  fast_lio:
    display_name: FAST-LIO2
    upstream: https://github.com/hku-mars/FAST_LIO
    ros2_port_hint: "ROS2 版常见为 FAST_LIO_ROS2 / fast_lio，装好后把包名填到 external_package"
    external_package: fast_lio
    external_launch: fast_lio.launch.py
    sensor_profile: [lidar3d_imu, mid360_imu, lidar3d_imu_cam, mid360_imu_cam]
    # 算法自己的输出（会因 fork 不同而变化，先按最常见的填，跑不通就改这里）
    algorithm_outputs:
      cloud: /cloud_registered
      odom: /Odometry
      map_frame: camera_init
    adapter:
      in_cloud_topic: /cloud_registered
      publish_2d_map: true
      height_min: -0.5
      height_max: 2.0
    notes: >
      紧耦合 IEKF，轻量、依赖少，WSL 里最容易编。第一个跑通它，用来验证
      整条链路（仿真→契约→可视化→指标）是通的。
      注意它发布的 TF 是 camera_init -> body，契约适配器依赖 map->odom 存在；
      如果它不发布 map->odom，需要开启 adapter 里的 frame_override
      或在 config 里把 map_frame 对齐。

  # -------------------------------------------------------------------------
  lio_sam:
    display_name: LIO-SAM
    upstream: https://github.com/TixiaoShan/LIO-SAM
    ros2_port_hint: "ROS2 版常见为 lio_sam（需自行编译，依赖 GTSAM）"
    external_package: lio_sam
    external_launch: run.launch.py
    sensor_profile: [lidar3d_imu, mid360_imu, lidar3d_imu_cam, mid360_imu_cam]
    algorithm_outputs:
      cloud: /lio_sam/mapping/cloud_registered
      odom: /lio_sam/mapping/odometry
      map_frame: map
    adapter:
      in_cloud_topic: /lio_sam/mapping/cloud_registered
      publish_2d_map: true
      height_min: -0.5
      height_max: 2.0
    notes: >
      因子图优化，带回环。对比 FAST-LIO2 可以直观看到回环对长走廊漂移的抑制。
      编译依赖 GTSAM，WSL 里预留 15–25 分钟。

  # -------------------------------------------------------------------------
  rtabmap:
    display_name: RTAB-Map（视觉 / RGB-D）
    upstream: https://github.com/introlab/rtabmap_ros
    ros2_port_hint: "apt 可装：ros-humble-rtabmap-ros"
    external_package: rtabmap_ros
    external_launch: rtabmap.launch.py
    sensor_profile: [lidar3d_imu_cam, mid360_imu_cam, cam_only]
    algorithm_outputs:
      cloud: /rtabmap/cloud_map
      map: /rtabmap/grid_map
      odom: /rtabmap/odom
      map_frame: map
    adapter:
      in_cloud_topic: /rtabmap/cloud_map
      publish_2d_map: false     # rtabmap 自己出 grid_map，不需要我们投影
      height_min: -0.5
      height_max: 2.0
    notes: >
      验证视觉/多传感器融合路线。需要 D435，所以 sensor_profile 必须带 cam。
      它会自己做视觉里程计，此时 odom_source 建议设为 lio（走 rtabmap 的 odom）。

  # -------------------------------------------------------------------------
  slam_toolbox:
    display_name: slam_toolbox（2D baseline）
    upstream: https://github.com/SteveMacenski/slam_toolbox
    ros2_port_hint: "apt 可装：ros-humble-slam-toolbox"
    external_package: slam_toolbox
    external_launch: online_sync_launch.py
    sensor_profile: [lidar3d_imu, mid360_imu]
    algorithm_outputs:
      cloud: ""                 # 2D 算法没有点云地图
      map: /map
      odom: /odom
      map_frame: map
    adapter:
      in_cloud_topic: /points
      # 关键：slam_toolbox 自己就是 /map 的权威发布者，适配器【必须】关掉 2D 投影。
      # 否则 /map 上会有两个发布者，rviz 显示在两个来源之间跳变，
      # 而指标节点取到的地图也时好时坏 —— 这种"偶发不一致"极难排查。
      publish_2d_map: false
      height_min: -0.5
      height_max: 2.0
    notes: >
      资源占用最小的 2D baseline。因为不单独装 2D 雷达，输入是
      points_to_scan 从 3D 点云切出来的 /scan。
      跑它的时候把 lidar_mode:=scan 打开，就会启动 points_to_scan。

# ---------------------------------------------------------------------------
# 运行期组合约束（launch 会做校验，违反直接报错，避免出现"静默跑不通"）
# ---------------------------------------------------------------------------
constraints:
  # odom 的发布者永远只能有一个
  odom_source_exclusive: true
  # 这些算法自己会发 odom TF，此时必须把 odom_source 设为 lio
  self_odometry_algorithms: [rtabmap]
  # 这些算法需要 /scan 输入
  requires_scan: [slam_toolbox]

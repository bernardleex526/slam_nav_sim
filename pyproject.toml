[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-validation-plugin"
version = "0.1.3"
description = "Evidence-aware SLAM and navigation validation runner"
requires-python = ">=3.9"
dependencies = ["numpy==1.26.4", "scipy==1.13.1", "Pillow==11.3.0", "PyYAML==6.0.2", "rosbags==0.9.23", "evo==1.30.0", "pytest==8.3.5"]

[project.scripts]
robot-validate = "robot_validate.cli:main"

[project.entry-points.pytest11]
robot_validate = "robot_validate.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

